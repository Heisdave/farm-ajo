[package]
name = "farm-ajo-circle"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly: near-sdk >= 5.24 refuses plain `cargo build` for wasm and
# requires the (much heavier) cargo-near toolchain. 5.1.0 builds with plain
# cargo + the wasm32 target, which is the fastest reliable path on this VM.
# "legacy" feature: enables near_sdk::collections (Vector) used by this contract.
near-sdk = { version = "=5.1.0", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.1.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
